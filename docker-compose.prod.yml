services:
  nginx:
    build:
      context: ./Client
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api  # Nginx proxies /api to the API container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./Client/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    cpus: 0.1
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: task_scheduler
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./Server/db/migrations:/docker-entrypoint-initdb.d
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d task_scheduler"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    mem_limit: 128m
    cpus: 0.1
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    mem_limit: 64m
    cpus: 0.1
    restart: unless-stopped
    networks:
      - app-network

  api:
    build: ./Server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://scheduler:${DB_PASSWORD:-changeme}@postgres:5432/task_scheduler
      REDIS_URL: redis://redis:6379
      ETCD_HOSTS: http://etcd:2379
      MAX_SESSIONS: 50
      COMPOSE_PROJECT_DIR: /app/compose
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.prod.yml:/app/compose/docker-compose.prod.yml:ro
      - ./.env.prod:/app/compose/.env.prod:ro
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  scheduler:
    build: ./Server
    command: node services/scheduler-coordinator/index.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://scheduler:${DB_PASSWORD:-changeme}@postgres:5432/task_scheduler
      REDIS_URL: redis://redis:6379
      ETCD_HOSTS: http://etcd:2379
    mem_limit: 128m
    cpus: 0.2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_started
    restart: 'no'  # Killed instances stay dead until Reset Instances
    networks:
      - app-network
    # Scale with: docker compose up --scale scheduler=3

  worker:
    build: ./Server
    command: node worker/index.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://scheduler:${DB_PASSWORD:-changeme}@postgres:5432/task_scheduler
      REDIS_URL: redis://redis:6379
    mem_limit: 128m
    cpus: 0.2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'  # Killed instances stay dead until Reset Instances
    networks:
      - app-network
    # Scale with: docker compose up --scale worker=5

  dispatcher:
    build: ./Server
    command: node services/dispatcher/index.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://scheduler:${DB_PASSWORD:-changeme}@postgres:5432/task_scheduler
      REDIS_URL: redis://redis:6379
    mem_limit: 64m
    cpus: 0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  recovery:
    build: ./Server
    command: node services/recovery/index.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://scheduler:${DB_PASSWORD:-changeme}@postgres:5432/task_scheduler
      REDIS_URL: redis://redis:6379
    mem_limit: 64m
    cpus: 0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  cleanup:
    build: ./Server
    command: node scripts/session-cleanup.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://scheduler:${DB_PASSWORD:-changeme}@postgres:5432/task_scheduler
      REDIS_URL: redis://redis:6379
    mem_limit: 64m
    cpus: 0.05
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pg_data:
  redis_data:

networks:
  app-network:
    driver: bridge
