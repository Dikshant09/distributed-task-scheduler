services:
  nginx:
    build:
      context: ./Client
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: testpassword123
      POSTGRES_DB: task_scheduler
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./Server/db/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d task_scheduler"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    restart: unless-stopped
    networks:
      - app-network

  api:
    build: ./Server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://scheduler:testpassword123@postgres:5432/task_scheduler
      REDIS_URL: redis://redis:6379
      ETCD_HOSTS: http://etcd:2379
      MAX_SESSIONS: 50
      COMPOSE_PROJECT_DIR: /app/compose
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/compose/docker-compose.yml:ro
      - ./.env:/app/compose/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  scheduler:
    build: ./Server
    command: node services/scheduler-coordinator/index.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://scheduler:testpassword123@postgres:5432/task_scheduler
      REDIS_URL: redis://redis:6379
      ETCD_HOSTS: http://etcd:2379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_started
    restart: 'no'  # Killed instances stay dead until Reset Instances
    networks:
      - app-network
    # Scale with: docker compose up --scale scheduler=3

  worker:
    build: ./Server
    command: node worker/index.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://scheduler:testpassword123@postgres:5432/task_scheduler
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'  # Killed instances stay dead until Reset Instances
    networks:
      - app-network
    # Scale with: docker compose up --scale worker=5

  dispatcher:
    build: ./Server
    command: node services/dispatcher/index.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://scheduler:testpassword123@postgres:5432/task_scheduler
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  recovery:
    build: ./Server
    command: node services/recovery/index.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://scheduler:testpassword123@postgres:5432/task_scheduler
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  cleanup:
    build: ./Server
    command: node scripts/session-cleanup.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://scheduler:testpassword123@postgres:5432/task_scheduler
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pg_data:
  redis_data:

networks:
  app-network:
    driver: bridge
