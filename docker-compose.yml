version: '3.8'

services:
  etcd:
    image: bitnami/etcd:3.6.4-debian-12-r3
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/bitnami/etcd-data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: task_scheduler
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./Server/db/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./Server
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - etcd
    volumes:
      - ./Server:/app
      - /app/node_modules

  scheduler:
    build:
      context: ./Server
      dockerfile: infra/docker/scheduler.Dockerfile
    deploy:
      replicas: 3
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - etcd
    volumes:
      - ./Server:/app
      - /app/node_modules

  worker:
    build:
      context: ./Server
      dockerfile: infra/docker/worker.Dockerfile
    deploy:
      replicas: 3
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - etcd
    volumes:
      - ./Server:/app
      - /app/node_modules

volumes:
  etcd_data:
  pg_data:
  redis_data:
